name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows release binary
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify executable exists
        run: test -f build/KmTronicRelay.exe
